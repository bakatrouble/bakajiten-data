name: Pack data

# Daily packed artifacts (*.bin.gz + manifest.json) from upstream
# sources, built with the ghcr.io/bakatrouble/bakajiten-utils image.
# Byte-identical days publish nothing. Manual runs via workflow_dispatch.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: pack-data

env:
  IMAGE: ghcr.io/bakatrouble/bakajiten-utils:latest

jobs:
  pack:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Resolve utils image digest.
        id: image
        run: |
          DIGEST="$(docker manifest inspect "$IMAGE" | jq -r '.config.digest')"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Cache utils image.
        id: image-cache
        uses: actions/cache@v4
        with:
          path: /tmp/bakajiten-utils.tar
          key: bakajiten-utils-${{ steps.image.outputs.digest }}

      - name: Load or pull utils image.
        run: |
          if [[ -f /tmp/bakajiten-utils.tar ]]; then
            docker load -i /tmp/bakajiten-utils.tar
          else
            docker pull "$IMAGE"
            docker save "$IMAGE" -o /tmp/bakajiten-utils.tar
          fi

      - name: Prepare dirs.
        run: mkdir -p sources out

      - name: Set tag.
        id: tag
        run: echo "tag=data-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Download previous manifest.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf prev && mkdir prev
          LATEST="$(gh release list --limit 1 --json tagName -q '.[0].tagName')"
          if [[ -n "$LATEST" ]]; then
            gh release download "$LATEST" --pattern manifest.json --dir prev --clobber 2>/dev/null || true
          fi

      - name: Fetch sources.
        run: >
          docker run --rm -v "$PWD:/work" "$IMAGE"
          fetch-data --out-dir /work/sources

      - name: Pack artifacts.
        run: >
          docker run --rm -v "$PWD:/work" "$IMAGE"
          pack-data --kanjivg /work/sources/kanjivg
          --templates-out /work/out/templates.bin
          --kanjidic /work/sources/kanjidic2.xml --kanji-out /work/out/kanji.bin
          --jmdict /work/sources/JMdict.xml --jmdict-out /work/out/jmdict.bin
          --jmnedict /work/sources/JMnedict.xml --jmnedict-out /work/out/jmnedict.bin
          --kokugo /work/sources/ja-extract.jsonl
          --wordnet /work/sources/wn-ntumc-jpn.xml
          --kokugo-out /work/out/kokugo.bin
          --jmdict-backfill /work/sources/JMdict.xml
          --jlpt /work/jlpt.csv --json
          | tee out/summaries.json

      - name: Gzip + manifest.
        run: >-
          python3 pack.py --summaries out/summaries.json
          --out out
          --prev prev/manifest.json
          --manifest-url "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/manifest.json"

      - name: Skip when unchanged.
        id: changed
        run: |
          if [[ -f prev/manifest.json ]]; then
            # Compare content hashes (sha256 of the packed bytes):
            # upstream versions move some days without content
            # changes, and sizes alone can't tell why they moved.
            if python3 -c "import json,sys; f=lambda m: {k:v['sha256'] for k,v in json.load(open(m))['files'].items()}; sys.exit(0 if f('prev/manifest.json')==f('out/manifest.json') else 1)"; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "identical content, skipping release"
              exit 0
            fi
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish release.
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" out/*.bin.gz out/manifest.json \
            --title "${{ steps.tag.outputs.tag }}" --notes "Daily packed artifacts (upstream sources as of $(date -u +%Y-%m-%d))."
